[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
markers =
    auth: Authentication and Authorization tests
    weather: Core weather API endpoint tests
    current: Weather current conditions endpoint tests
    forecast: Weather forecast alias tests
    daily: Daily weather forecast tests
    hourly: Hourly weather forecast tests
    geo: Weather geo & IP lookup endpoint tests
    usage: Usage and quota endpoint tests
    error: Edge case and error handling tests
    contract: JSON Schema contract validation tests
    performance: API latency and response time performance tests
    slow: Tests that take longer than usual to execute
